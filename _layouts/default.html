<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Posts</a>
        <a href="{{ '/ai-news/' | relative_url }}"{% if page.url == '/ai-news/' or page.categories contains 'ai-news' %} class="active"{% endif %}>AI News</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>About</a>
      </div>
    </div>
  </nav>
  <main>
    {{ content }}
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <span>© {{ 'now' | date: '%Y' }} {{ site.author }}</span>
      <a href="https://github.com/{{ site.github_username }}">GitHub</a>
    </div>
  </footer>
</body>
</html>
